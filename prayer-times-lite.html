<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {

  text-align: center;

.header {

.location { font-size: 13px; margin: 8px 0; color: #065f46; font-weight: 700; }
.prayer-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 10px 0;
}
.prayer-card {
  background: white;
  border: 2px solid #d1fae5;
  border-radius: 12px;
  padding: 12px 8px;

}
.prayer-card.active {

.prayer-time { font-size: 18px; font-weight: 800; color: #059669; font-family: monospace; }
.prayer-card.active .prayer-name { color: #b45309; }
.prayer-card.active .prayer-time { color: #d97706; }
.next-info {
  background: white;
  border-radius: 12px;
  padding: 10px;
  margin: 8px 0;
  font-size: 13px;
  border: 2px solid #d1fae5;
}
.next-info strong { color: #059669; }
.info-section {

  border-bottom: 2px solid #fde68a;
  padding: 10px;
  margin: 10px 0;
  border-radius: 12px;
  min-height: 80px;
}
.info-card {
  text-align: right;
  padding: 8px 12px;

}
.info-text { font-size: 13px; color: #78350f; font-weight: 600; line-height: 1.8; }
.info-source { font-size: 10px; color: #b45309; opacity: 0.7; margin-top: 4px; }
.info-icon { font-size: 20px; margin-left: 6px; }

.info-text .msg-video, #infoText .msg-video {
  max-width: 100%;
  width: 320px;
  max-height: 210px;
  min-height: 56px;
  border-radius: 10px;
  display: inline-block;
  margin: 4px 0;
  background: #000;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
}
/* v26.7: مشغل الريلز — فيديو الكونتنت بملء الشاشة: تشغيل تلقائي + تكرار + لمسة إيقاف/تشغيل + تمرير رأسي بين المقاطع */
#reelsViewer{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:none;z-index:100000;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#reelsViewer.show{display:block;}
#reelsStage{position:absolute;top:0;left:0;right:0;bottom:0;}
#reelsVid{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000;}
#reelsVid.cover{object-fit:cover;}
.reels-btn{position:absolute;top:14px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:19px;line-height:42px;text-align:center;z-index:3;cursor:pointer;}
#reelsClose{left:14px;}
#reelsMute{right:14px;}
#reelsCounter{position:absolute;top:26px;left:0;right:0;text-align:center;color:rgba(255,255,255,.85);font-size:12px;font-weight:700;z-index:2;pointer-events:none;direction:ltr;}
#reelsSpin{position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;z-index:2;pointer-events:none;display:none;-webkit-animation:reelsSpin .9s linear infinite;animation:reelsSpin .9s linear infinite;}
@-webkit-keyframes reelsSpin{to{-webkit-transform:rotate(360deg);transform:rotate(360deg);}}
@keyframes reelsSpin{to{-webkit-transform:rotate(360deg);transform:rotate(360deg);}}
#reelsPause{position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.45);z-index:2;pointer-events:none;opacity:0;-webkit-transition:opacity .25s;transition:opacity .25s;}
#reelsPause span{position:absolute;top:15px;width:9px;height:34px;border-radius:2px;background:#fff;}
#reelsPause .p1{left:20px;}
#reelsPause .p2{right:20px;}
#reelsPause.show{opacity:1;}
#reelsCap{position:absolute;bottom:24px;left:12px;right:12px;color:#fff;font-size:13px;font-weight:600;line-height:1.7;text-align:right;direction:rtl;max-height:6.8em;overflow:hidden;z-index:2;pointer-events:none;text-shadow:0 1px 4px rgba(0,0,0,.9);}
#reelsProg{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.22);z-index:3;}
#reelsProgFill{height:100%;width:0;background:#fff;}
#reelsFail{position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);color:#fff;font-size:13px;font-weight:700;text-align:center;z-index:4;display:none;background:rgba(127,127,127,.25);padding:10px 16px;border-radius:10px;max-width:80%;}
/* v26.7: غلاف الفيديو المدمج + زر تشغيل — النقر يفتح مشغل الريلز بدل أزرار الفيديو الصغيرة */
.vid-wrap{position:relative;display:inline-block;max-width:100%;cursor:pointer;margin:4px 0;}
.vid-wrap .msg-video{display:block;margin:0;}
.vid-play{position:absolute;top:50%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);z-index:1;pointer-events:none;}
.vid-play:before{content:"";position:absolute;top:50%;left:50%;-webkit-transform:translate(-40%,-50%);transform:translate(-40%,-50%);border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;}
.vid-fail {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 56px;
  min-width: 200px;
  max-width: 100%;
  border-radius: 10px;
  background: rgba(127, 127, 127, .14);
  color: #6b7280;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  padding: 8px 14px;
}
.info-text .msg-img, #infoText .msg-img {

  min-height: 56px;
  border-radius: 10px;
  display: inline-block;
  margin: 4px 0;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
  background: rgba(127, 127, 127, .14);
}
.msg-img.img-fail {
  min-height: 56px;
  max-height: 56px;
  min-width: 160px;
  cursor: pointer;
  opacity: .85;
}
.update-toast {
  position: fixed; bottom: 16px; left: 16px; right: 16px;
  background: linear-gradient(135deg, #065f46, #10b981); color: white;
  padding: 14px; border-radius: 14px; font-size: 14px; z-index: 9999;
  display: none; text-align: center; cursor: pointer;
  box-shadow: 0 8px 28px rgba(0,0,0,.35);
}
.error-msg { color: #dc2626; font-size: 12px; padding: 10px; }
.loading { color: #6b7280; font-size: 12px; padding: 20px; }
.footer { font-size: 10px; color: #9ca3af; margin-top: 10px; padding: 8px; }

.dark-mode .prayer-name { color: #6ee7b7; }
.dark-mode .prayer-time { color: #a7f3d0; }
.dark-mode .next-info { background: #16241d; border-color: #2b4a3a; color: #e8f5ee; }
.dark-mode .info-section { background: linear-gradient(135deg, #1a1a06, #1f1c09); border-color: #6b5416; }
.dark-mode .info-text { color: #fde68a; }
.dark-mode .info-source { color: #fbbf24; }
.dark-mode .location { color: #6ee7b7; }
.dark-mode .footer { color: #6b7280; }
</style>

<script>
// ========================================
// prayer-times-lite.html — نسخة مبسطة للأجهزة القديمة (Android 4.2.2+)

// ========================================

var PT_METHOD = 3; // رابطة العالم الإسلامي
var PT_SCHOOL = 0; //_STANDARD
var KAABA_LAT = 21.4224779, KAABA_LNG = 39.8251832;
var latitude = null, longitude = null;
var prayerData = null;
var cachedInfoItems = [];
var currentInfoIdx = 0;
var CURRENT_APP_VERSION = "26.16"; /* v26.16: إصلاح وصول التحديثات — مصادر raw أولاً + رد نداء مسمّى + إنقاذ مباشر + مقارنة رقمية */
/* v26.8: العنوان وشارة الرأس تُبنى دائماً من CURRENT_APP_VERSION */
try {

  var _hdrVer = document.getElementById("hdrAppVer");
  if (_hdrVer) _hdrVer.textContent = "v" + CURRENT_APP_VERSION;
} catch(eVerTitle) {}
// v26.3/26.4: تعويض فشل تحميل الصور تلقائياً — jsDelivr أولاً (شهادة GlobalSign تعمل على كل أندرويد حتى القديم)
// ثم raw ثم Pages (شهادتهما Let's Encrypt تُرفض على أندرويد < 7.1.1)
// + مُفرِب ذاكرة ‎?v= يكسر 404 المخزنة في ذاكرة جهاز المستخدم (jsDelivr يخزّنها حتى 7 أيام)
var __IMG_HOSTS = [
  "https://cdn.jsdelivr.net/gh/ehessan1974-maker/prayer-times@main/",
  "https://raw.githubusercontent.com/ehessan1974-maker/prayer-times/main/",
  "https://ehessan1974-maker.github.io/prayer-times/"
];
function __imgBust(u){
  if (u && u.indexOf("?") === -1) return u + "?v=" + CURRENT_APP_VERSION;
  return u;
}
function __imgFix(img) {
  if (img && img.id === "reelsVid") return; /* v26.7: فيديو الريلز يدير مضيفاته بنفسه (__reelsHostRetry) */
  var now = Date.now();
  if (img._fixT && now - img._fixT < 80) return;
  img._fixT = now;
  var src = img.getAttribute("src") || "";
  var q = "", base = src, qi = src.indexOf("?");
  if (qi !== -1) { base = src.slice(0, qi); q = src.slice(qi); }
  var m = base.match(/media\/[A-Za-z0-9._-]+$/);
  if (!m) { img.onerror = null; return; }
  var path = m[0];
  /* v26.4 [إصلاح حلقة لا نهائية]: تسجيل المضيفات المُجرّبة فلا عودة إليها أبداً —
     بدونه على الأجهزة القديمة: raw يفشل بشهادته فيرجع لـjsDelivr فيعيد 404 مخزنة فيرجع لraw… يرجف بلا نهاية */
  if (!img._tried) img._tried = {};
  for (var i = 0; i < __IMG_HOSTS.length; i++) {
    if (base.indexOf(__IMG_HOSTS[i]) === 0) { img._tried[i] = true; break; }
  }
  var next = -1;
  for (var j = 0; j < __IMG_HOSTS.length; j++) {
    if (!img._tried[j]) { next = j; break; }
  }
  if (next === -1) {
    img.onerror = null;
    /* v26.5: للفيديو — مربع ثابت يُستبدل به الوسم، والنقر يعيد بناء وسم جديد نظيف */
    if (img.tagName === "VIDEO") { __vidFailBox(img, path); return; }
    img.classList.add("img-fail");
    img.alt = "📷 صورة — اضغط لإعادة المحاولة";
    img.onclick = function(ev){
      try { if (ev && ev.stopPropagation) ev.stopPropagation(); } catch(e0){}
      img._fixT = null;
      img._tried = {};
      img.classList.remove("img-fail");
      img.alt = "صورة";
      img.onerror = function(){ __imgFix(img); };
      img.src = __IMG_HOSTS[0] + path + "?r=" + Date.now();
    };
    return;
  }
  img.onerror = function(){ __imgFix(img); };
  img.src = __IMG_HOSTS[next] + path + q;
}
// v26.5: فشل الفيديو نهائياً — مربع ثابت بدل الوسم + نقرة تعيد بناء وسم جديد من الصفر
function __vidFailBox(v, path) {
  var box = document.createElement("div");
  box.className = "vid-fail";
  box.textContent = "🎬 فيديو — اضغط لإعادة المحاولة";
  box.onclick = function(ev){
    try { if (ev && ev.stopPropagation) ev.stopPropagation(); } catch(e0){}
    /* v26.7: إعادة البناء بغلاف vid-wrap + النقر يفتح مشغل الريلز (تُستبدل الحاوية كلها إن وُجدت) */
    var nv = document.createElement("video");

    nv.onerror = function(){ __imgFix(nv); };
    nv.src = __IMG_HOSTS[0] + path + "?r=" + Date.now();
    var wrap = document.createElement("span");
    wrap.className = "vid-wrap";
    var pl = document.createElement("span");
    pl.className = "vid-play";
    wrap.appendChild(nv); wrap.appendChild(pl);
    var repl = (box.parentNode && box.parentNode.className === "vid-wrap") ? box.parentNode : box;

  };

document.addEventListener("error", function(e){
  var t = e.target;
  if (t && (t.tagName === "IMG" || t.tagName === "VIDEO") && (t.getAttribute("src") || "").indexOf("/media/") !== -1) __imgFix(t);

// ==================== v26.7: مشغل الريلز ====================
// فيديو الكونتنت بملء الشاشة مثل مقاطع الريلز: تشغيل تلقائي مع الصوت، تكرار، لمسة = إيقاف/تشغيل،
// تمرير رأسي بين مقاطع الكونتنت (سحب لأعلى = التالي، لأسفل = السابق، وفي أول مقطع = إغلاق).
// ES5 بالكامل توافقاً مع الأجهزة القديمة + تجاوز المضيفات (__IMG_HOSTS) عند فشل التحميل.
var __reelsList = [], __reelsIdx = 0, __reelsApi = null;
function __reelsPath(u){ var m = String(u || "").split("?")[0].match(/media\/[A-Za-z0-9._-]+$/); return m ? m[0] : ""; }
function __reelsClean(t){
  return String(t || "")
    .replace(/\[video:[^\]\s]+\]/g, " ").replace(/\[img:[^\]\s]+\]/g, " ")
    .replace(/https?:\/\/[^\s<]+/g, " ")
    .replace(/\s+/g, " ").trim();
}
function __reelsCollect(){
  var out = [], seen = {}, items = (typeof cachedInfoItems !== "undefined" && cachedInfoItems) ? cachedInfoItems : [];
  for (var i = 0; i < items.length; i++) {
    var raw = "";
    try { raw = JSON.stringify(items[i]); } catch(e1) { continue; }
    if (raw.indexOf("[video:") === -1) continue;
    var cap = __reelsClean(items[i] && (items[i].text || items[i].title || ""));
    var m = raw.match(/\[video:([^\]\s]+)\]/g) || [];
    for (var j = 0; j < m.length; j++) {
      var u = m[j].slice(7, -1);
      var p = __reelsPath(u);
      if (!p || seen[p]) continue;
      seen[p] = 1;
      out.push({ url: u, cap: cap });
    }
  }
  return out;
}
function openReels(src){
  __reelsList = __reelsCollect();
  var p = __reelsPath(src), idx = -1;
  for (var i = 0; i < __reelsList.length; i++) { if (__reelsPath(__reelsList[i].url) === p) { idx = i; break; } }
  if (idx === -1) { __reelsList.unshift({ url: String(src || ""), cap: "" }); idx = 0; }
  if (!__reelsApi) __reelsApi = __reelsBuild();
  var A = __reelsApi;
  __reelsResetVisual();
  A.el.className = "show";
  __reelsLoad(idx);
}
function __reelsBuild(){
  var el = document.createElement("div");
  el.id = "reelsViewer";
  el.innerHTML =
    '<div id="reelsStage"><video id="reelsVid" playsinline loop preload="auto"></video></div>' +
    '<div id="reelsClose" class="reels-btn">✕</div>' +

    el: el,

  A.closeEl.onclick = function(){ __reelsCloseAll(); };
  A.muteEl.onclick = function(e){
    try { if (e && e.stopPropagation) e.stopPropagation(); } catch(e0){}
    A.vid.muted = !A.vid.muted;

    /* الفيديو العمودي يملأ الشاشة (cover)، والأفقي يُعرض كاملاً (contain) */
    A.vid.className = (A.vid.videoHeight > A.vid.videoWidth) ? "cover" : "";

    if (!A.vid.duration) return;

// ===== v26.16: إنقاذ تحديث lite — النسخ القديمة كانت تمرّر دالة مجهولة للجسر الأصلي
// فيفشل evaluateJavascript بصمت ولا يُعاد التحميل أبداً (زر التحديث لا يجدي)،
// وكود Java ينزّل من jsDelivr حصرياً (كاش قديم = تجمّد أو ارتداد للخلف).
// الإصلاح: ردّ نداء مسمّى + فحص الملف المحفوظ قبل/بعد تنزيل Java + إنقاذ مباشر
// عبر جلب HTML من raw/Pages/jsDelivr وعرضه فوراً بـ document.write.
function _liteParseAppVersion(html) {
  try {
    if (!html || typeof html !== "string") return "";
    // v26.16: استهدف التصريح نفسه — أول ذكر للاسم قد يكون استخداماً لا تصريحاً
    var m = html.match(/CURRENT_APP_VERSION\s*=\s*"([0-9]+(?:\.[0-9]+)*)"/);
    return (m && m[1]) ? m[1] : "";
  } catch(e) { return ""; }
}

function _liteRescueFetchHtml(cb) {
  var idx = 0;
  function tryNext() {
    if (idx >= LITE_HTML_SOURCE_URLS.length) { try { cb(null); } catch(eC) {} return; }
    var url = LITE_HTML_SOURCE_URLS[idx] + "prayer-times-lite.html?t=" + Date.now();
    idx++;
    try {
      var x = new XMLHttpRequest();
      var settled = false;
      x.open("GET", url, true);
      x.timeout = 25000;
      x.onreadystatechange = function() {
        if (settled || x.readyState !== 4) return;
        settled = true;
        var html = (x.status === 200) ? x.responseText : null;
        var v = _liteParseAppVersion(html || "");
        // اقبل فقط HTML أحدث من نسختنا — يمنع كاش قديم من ارتدادنا للخلف
        if (html && html.length > 1000 && v && liteCompareVersions(v, CURRENT_APP_VERSION) > 0) {
          try { cb(html); } catch(eC2) {}
          return;
        }
        tryNext();
      };
      x.ontimeout = function() { if (settled) return; settled = true; tryNext(); };
      x.onerror = function() { if (settled) return; settled = true; tryNext(); };
      x.send();
    } catch(e) { tryNext(); }
  }
  tryNext();
}

function _liteRescueApply(html) {
  setTimeout(function() {
    try {
      document.open();
      document.write(html);
      document.close();
    } catch(eW) {
      try { location.reload(); } catch(eR) {}
    }
  }, 600);
}

// قراءة نسخة الملف المحفوظ في filesDir (لدفع lite) — لكشف الارتداد
function _liteReadFilesDirVersion(cb) {
  var paths = [
    "file:///data/user/0/com.ehessan.prayertimes/files/prayer-times-lite.html",
    "file:///data/data/com.ehessan.prayertimes/files/prayer-times-lite.html"
  ];
  var idx = 0;
  function tryNext() {
    if (idx >= paths.length) { try { cb(""); } catch(eC) {} return; }
    try {
      var x = new XMLHttpRequest();
      var settled = false;
      x.open("GET", paths[idx] + "?t=" + Date.now(), true);
      x.timeout = 4000;
      x.onreadystatechange = function() {
        if (settled || x.readyState !== 4) return;
        settled = true;
        var v = (x.responseText && x.responseText.length > 1000) ? _liteParseAppVersion(x.responseText) : "";
        if (v) { try { cb(v); } catch(eC2) {} return; }
        idx++; tryNext();
      };
      x.ontimeout = function() { if (settled) return; settled = true; idx++; tryNext(); };
      x.onerror = function() { if (settled) return; settled = true; idx++; tryNext(); };
      x.send();
    } catch(e) { idx++; tryNext(); }
  }
  tryNext();
}

// v26.16: رد نداء مسمّى عالمي — Java يستدعيه باسم نصي بعد اكتمال التنزيل
function _liteUpdateDownloadDone(success) {
  var ok = (success === true || success === "true");
  if (!ok) {
    _liteRescueFetchHtml(function(html) { if (html) _liteRescueApply(html); });
    return;
  }
  // تحقق ما بعد التنزيل: إن كان الملف المحفوظ أقدم من نسختنا (ارتداد كاش Java القديم) فلا نعيد التحميل
  _liteReadFilesDirVersion(function(fv) {
    if (fv && liteCompareVersions(fv, CURRENT_APP_VERSION) < 0) {
      _liteRescueFetchHtml(function(html2) { if (html2) _liteRescueApply(html2); });
      return;
    }
    if (window.AndroidPrayer && typeof AndroidPrayer.reloadUpdatedHtml === "function") {
      try { AndroidPrayer.reloadUpdatedHtml(); return; } catch(e) {}
    }
    window.location.reload();
  });
}

function applyUpdate() {
  el("updateToast").style.display = "none";
  if (window.AndroidPrayer && typeof AndroidPrayer.downloadAppUpdate === "function") {
    // v26.16: فحص قبل الاستدعاء — إن كان الملف المحفوظ أقدم من نسختنا فسيرتدّ بنا Java القديم
    _liteReadFilesDirVersion(function(fv0) {
      if (fv0 && liteCompareVersions(fv0, CURRENT_APP_VERSION) < 0) {
        _liteRescueFetchHtml(function(html) { if (html) _liteRescueApply(html); });
        return;
      }
      try {
        // الاسم النصي لدالة عامة — الدالة المجهولة كانت تصل إلى Java كنص مصدر وتفشل بصمت
        AndroidPrayer.downloadAppUpdate("_liteUpdateDownloadDone");
      } catch(e) {
        _liteRescueFetchHtml(function(html) { if (html) _liteRescueApply(html); });
      }
    });
    return;
  }
  // متصفح: إن وُجدت نسخة أحدث (أو الكاش قديم) امسح وأعد التحميل
  window.location.reload();
}

// ===== الوضع الليلي =====
function toggleTheme() {
  try {
    var isDark = document.body.className.indexOf("dark-mode") !== -1;
    if (isDark) {
      document.body.className = document.body.className.replace(/\s*dark-mode/g, "");
    } else {
      document.body.className += " dark-mode";
    }
  } catch(e) {}
}

// أندرويد: عبر NativeBridge.switchToFull (يحفظ التفضيل ويعيد التحميل)

function switchToFullVersion() {
  if (window.AndroidPrayer && typeof AndroidPrayer.switchToFull === "function") {

    try { AndroidPrayer.switchToFull(); return; } catch(e) {}
  }
  try { window.location.href = "prayer-times.html"; } catch(e) {}
}

init();
