plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ehessan.prayertimes'
    compileSdk 34

    defaultConfig {
        applicationId "com.ehessan.prayertimes"
        minSdk 19
        targetSdk 34
        versionCode 71
        versionName "25.23"
    }

    signingConfigs {
        release {
            // التوقيع سيُولّد تلقائياً في GitHub Actions
            // لا نضع مفاتيح حساسة هنا
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // التوقيع يُدار من قبل GitHub Actions
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    // لا نستخدم أي مكتبات خارجية — التطبيق يعتمد على Android SDK فقط
}
