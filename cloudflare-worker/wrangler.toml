name = "prayer-times-worker"
main = "worker.js"
compatibility_date = "2024-09-23"

# قاعدة بيانات D1
# ملاحظة: لا تضع database_id هنا — سيتم ربطها من Dashboard Cloudflare
# اذهب إلى Worker → Settings → Bindings → Add → D1 database
# Variable name: DB
# اختر: prayer-times-db

# متغيرات البيئة (القيم غير السرية)
# ملاحظة: يمكن إضافة هذه من Dashboard أيضاً، لكن نضعها هنا كقيم افتراضية
[vars]
GH_OWNER = "ehessan1974-maker"
GH_REPO = "prayer-times"
GH_PATH = "content.json"
GH_BRANCH = "main"
ADMIN_EMAIL = "your-email@example.com"

# المتغيرات السرية تُعدّ عبر Dashboard Cloudflare:
# Worker → Settings → Variables and Secrets → Add (Type: Secret)
# - GH_PAT
# - JWT_SECRET
