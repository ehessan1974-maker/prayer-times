name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'prayer-times.html'
      - 'android-app/**'
      - 'android-studio/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      run: |
        # تثبيت SDK components يدوياً عبر sdkmanager الموجود مسبقاً
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        # تحميل cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
        # تثبيت المكونات المطلوبة
        yes | sdkmanager --licenses >/dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
        sdkmanager --list_installed

    - name: Copy latest prayer-times.html to assets
      run: |
        mkdir -p android-studio/app/src/main/assets
        cp -f prayer-times.html android-studio/app/src/main/assets/prayer-times.html

    - name: Restore release keystore from Secrets
      env:
        KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        KS_PASS: ${{ secrets.KS_PASS }}
      run: |
        # v25.37 [أمني]: لا كلمات سر في هذا الملف — keystore الثابت الحقيقي يأتي من Secrets
        # (Settings → Secrets and variables → Actions → KEYSTORE_BASE64 و KS_PASS)
        # بحيث يكون توقيع APK الـ CI مطابقاً لتوقيع الإصدارات السابقة ويعمل كتحديث مباشر
        if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ]; then
          echo "::error::أضف السرّين KEYSTORE_BASE64 (base64 لملف keystore) و KS_PASS أولاً"
          exit 1
        fi
        echo "$KEYSTORE_B64" | base64 -d > android-studio/app/release.keystore
        keytool -list -keystore android-studio/app/release.keystore -storepass "$KS_PASS" -alias prayertimes >/dev/null
        echo "✅ Keystore restored and verified (alias: prayertimes)"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Release APK
      working-directory: android-studio
      run: |
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Find APK
      run: |
        find android-studio/app/build/outputs -name "*.apk" -type f 2>/dev/null
        mkdir -p artifacts
        APK=$(find android-studio/app/build/outputs -name "*release*.apk" -type f | head -1)
        if [ -z "$APK" ]; then
          APK=$(find android-studio/app/build/outputs -name "*.apk" -type f | head -1)
        fi
        echo "Found APK: $APK"
        cp "$APK" artifacts/prayer-times.apk

    - name: Sign APK
      env:
        KS_PASS: ${{ secrets.KS_PASS }}
      run: |
        cd artifacts
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
          --ks ../android-studio/app/release.keystore \
          --ks-pass "pass:$KS_PASS" \
          --ks-key-alias prayertimes \
          --key-pass "pass:$KS_PASS" \
          --out prayer-times-signed.apk prayer-times.apk
        $ANDROID_HOME/build-tools/34.0.0/apksigner verify prayer-times-signed.apk && echo "✅ APK signed successfully"

    - name: Rename APK with version
      run: |
        # المصدر الرسمي للإصدار هو version.json وليس build.gradle
        VERSION=$(jq -r .appVersion version.json)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        cp artifacts/prayer-times-signed.apk artifacts/prayer-times-v${VERSION}.apk
        ls -la artifacts/

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: prayer-times-apk-v${{ env.VERSION }}
        path: artifacts/prayer-times-*.apk
        retention-days: 90

    - name: Commit APK to repo
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        cp artifacts/prayer-times-signed.apk android-app/prayer-times.apk
        cp artifacts/prayer-times-signed.apk android-app/prayer-times-v${VERSION}.apk
        cp artifacts/prayer-times-signed.apk public/prayer-times-v${VERSION}.apk
        # استخدام -f لأن .gitignore يتجاهل ملفات APK
        git add -f android-app/prayer-times.apk android-app/prayer-times-v${VERSION}.apk public/prayer-times-v${VERSION}.apk
        git commit -m "chore: build APK v${VERSION} [skip ci]" || echo "No changes to commit"
        git push origin HEAD:main || git push
